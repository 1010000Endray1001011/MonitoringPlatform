# SPA fallback: any path that isn't a real static file resolves to
# index.html instead of a raw nginx 404, so a client-side route like
# /monitors/abc-123 (which has no matching file on disk) still loads the
# app and lets React Router take over.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
