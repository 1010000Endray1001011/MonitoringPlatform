[project]
name = "monitoringplatform"
version = "0.1.0"
description = "API / URL uptime monitoring platform."
authors = [
    {name = "Rei-rida",email = "reifraps0@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.15,<4.0)",
    "djangorestframework-simplejwt (>=5.3,<6.0)",
    "drf-spectacular (>=0.27,<0.28)",
    "django-filter (>=24.3,<25.0)",
    "celery (>=5.4,<6.0)",
    "redis (>=5.0,<6.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "django-environ (>=0.11,<0.12)",
    "requests (>=2.32,<3.0)",
    "gunicorn (>=23.0,<24.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
pytest-cov = "^5.0"
pytest-socket = "^0.7"
factory-boy = "^3.3"
responses = "^0.25"
freezegun = "^1.5"
black = "^24.10"
ruff = "^0.7"
isort = "^5.13"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db --disable-socket --allow-hosts=127.0.0.1,::1"

[tool.coverage.run]
source = ["apps", "integrations", "config"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["apps", "config", "integrations", "tests"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "DJ"]
ignore = ["E501"]
# isort (I) is intentionally not selected — isort owns import sorting, ruff
# only lints. Running both on the same rule fights and loops in pre-commit.
